<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5EEFF"/>
      <stop offset="100%" stop-color="#DAE3F4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#mapBg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <!-- Decorative Topographic Contour Lines -->
  <path d="M 0 300 C 300 200, 600 400, 1200 250" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.5"/>
  <path d="M 0 350 C 350 250, 700 450, 1200 300" fill="none" stroke="#93C5FD" stroke-width="1.5" opacity="0.4"/>
  <path d="M 0 400 C 400 300, 800 500, 1200 350" fill="none" stroke="#93C5FD" stroke-width="1.2" opacity="0.3"/>
  <!-- Map Pin Marker Icon in Center -->
  <g transform="translate(600, 260)">
    <circle cx="0" cy="0" r="40" fill="#14304F" opacity="0.1"/>
    <circle cx="0" cy="0" r="24" fill="#C9A227"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>
</svg>
